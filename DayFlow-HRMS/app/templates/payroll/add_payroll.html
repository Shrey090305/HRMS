{% extends "base.html" %}

{% block title %}Add Payroll - DayFlow HRMS{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-plus"></i> Add Payroll Record</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="user_id" class="form-label">Employee *</label>
                            <select class="form-select" id="user_id" name="user_id" required>
                                <option value="">Select Employee</option>
                                {% for emp in employees %}
                                <option value="{{ emp.id }}">{{ emp.employee_id }} - {{ emp.get_full_name() }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="month" class="form-label">Month *</label>
                                <select class="form-select" id="month" name="month" required>
                                    {% for month in months %}
                                    <option value="{{ month }}">{{ month }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="year" class="form-label">Year *</label>
                                <input type="number" class="form-control" id="year" name="year" 
                                       value="2026" min="2020" max="2030" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="basic_salary" class="form-label">Basic Salary *</label>
                            <input type="number" step="0.01" class="form-control" id="basic_salary" 
                                   name="basic_salary" required>
                        </div>

                        <div class="mb-3">
                            <label for="allowances" class="form-label">Allowances</label>
                            <input type="number" step="0.01" class="form-control" id="allowances" 
                                   name="allowances" value="0">
                        </div>

                        <div class="mb-3">
                            <label for="deductions" class="form-label">Deductions</label>
                            <input type="number" step="0.01" class="form-control" id="deductions" 
                                   name="deductions" value="0">
                        </div>

                        <div class="alert alert-info">
                            <p class="mb-0" id="net-salary-display">Net Salary: $0.00</p>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Payroll
                            </button>
                            <a href="{{ url_for('payroll.index') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
